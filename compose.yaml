services:
  music-intake:
    build: .
    image: music-intake:local
    restart: unless-stopped
    environment:
      DOWNLOADS_PATH: /downloads
      LIBRARY_PATH: /music
      STATUS_FILE: /state/status.json
      PROCESSED_FILE: /state/processed.json
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
      STABLE_OBSERVATIONS: ${STABLE_OBSERVATIONS:-3}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${DOWNLOADS_HOST_PATH:-./downloads}:/downloads:ro
      - ${LIBRARY_HOST_PATH:-./music}:/music
      - ${STATE_HOST_PATH:-./state}:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import json; json.load(open('/state/status.json'))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
